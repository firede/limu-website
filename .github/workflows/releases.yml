name: releases

# Fails while the site doesn't follow the latest release of limu, limumygo or limu-rs, so a
# release the site was left behind by shows as a failed run. README.md says how to follow one.
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: ./scripts/releases.sh
